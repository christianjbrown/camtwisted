name: CI

# Runs tools/check.sh, the same entry point the pre-push hook uses, so a push that passed locally
# passes here: every test, the 100% coverage gate, and a build of the app and camera extension.

on:
  pull_request:
  push:
    branches: [main]

# A newer push to a pull request makes the older run's answer irrelevant, so it is cancelled.
# Pushes to main are grouped by commit, so a second merge never cancels the first one's run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # On the self-hosted Mac (label camtwisted): hosted macOS minutes count ten times against the
  # account's allowance, and the build needs a current Xcode. A run waits while that Mac is off.
  # A pull request from a fork never runs here, because the runner is a personal machine and a
  # fork's workflow would run its own code on it.
  gates:
    name: Gates
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, camtwisted]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install xcodegen
        run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Tests, 100% coverage and the app build
        run: tools/check.sh
