name: CI

# Runs tools/check.sh, the same entry point the pre-push hook uses, so a push that passed locally
# passes here: every test, the 100% coverage gate, and a build of the app and camera extension.

on:
  pull_request:
  push:
    branches: [main]

# A newer push to a pull request makes the older run's answer irrelevant, so it is cancelled.
# Pushes to main are grouped by commit, so a second merge never cancels the first one's run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # On a push to main, the gates are skipped when the pull request it came from already passed
  # this workflow on the identical tree. Any doubt runs them in full. See
  # christianjbrown/ci-already-tested.
  tested:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      tested: ${{ steps.check.outputs.tested }}
    steps:
      - name: Already passed on the pull request
        id: check
        uses: christianjbrown/ci-already-tested@main

  # On a pull request, the gates are skipped when the pre-push hook already ran them on exactly
  # this commit from a clean tree, which it records as a local-gates status. No status (a dirty
  # tree, --no-verify, another machine) runs them in full.
  local:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: read
    outputs:
      tested: ${{ steps.check.outputs.tested }}
    steps:
      - name: Already passed the pre-push gates
        id: check
        uses: christianjbrown/ci-already-tested/locally-tested@main

  # On the self-hosted Mac (label camtwisted): hosted macOS minutes count ten times against the
  # account's allowance, and the build needs a current Xcode. A run waits while that Mac is off.
  gates:
    name: Gates
    needs: [tested, local]
    if: ${{ !cancelled() && needs.tested.outputs.tested != 'true' && needs.local.outputs.tested != 'true' }}
    runs-on: [self-hosted, macOS, ARM64, camtwisted]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install xcodegen
        run: command -v xcodegen >/dev/null || brew install xcodegen
      - name: Tests, 100% coverage and the app build
        run: tools/check.sh
